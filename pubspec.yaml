name: landmark
description: Landmark Real Estate — Flutter app (Android & iOS)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Biometric login (Face ID / Touch ID / Android biometrics)
  local_auth: ^2.3.0

  # Camera capture + photo library picker
  image_picker: ^1.1.2
  path_provider: ^2.1.4

  # Mock on-device persistence (stand-in for a real backend)
  shared_preferences: ^2.3.2

  # IDs, formatting
  uuid: ^4.5.1
  intl: ^0.19.0

  # Signature pad for "sign on the realtor's screen" viewing verification
  signature: ^5.5.0

  # Deep link verification (landmarkapp://verify?token=...)
  app_links: ^6.3.2

  # Share the verification link to the buyer
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
